name: Private daily GA4 and Search Console reporting

on:
  schedule:
    - cron: "23 8 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: repaywise-private-daily-seo
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Authenticate to Google with short-lived identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reporting dependencies
        run: python -m pip install --disable-pip-version-check "google-auth>=2,<3" "requests>=2,<3"
      - name: Write aggregated report privately
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          SEO_SHEET_ID: ${{ vars.SEO_SHEET_ID }}
          SEO_SHEET_TAB: ${{ vars.SEO_SHEET_TAB }}
        run: python scripts/private_daily_reporting.py
