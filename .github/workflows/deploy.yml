####################################################################
# Deploy to Vercel
#
# WHY THIS EXISTS
# Vercel's GitHub integration stopped triggering builds for this repo
# on 11 July 2026. Disconnecting/reconnecting the Git integration,
# reinstalling the Vercel GitHub App, and firing a Deploy Hook all
# failed to produce a deployment. Manual "Redeploy" works (it reuses
# stored source), which shows the build system is fine — Vercel simply
# is not picking up new commits.
#
# This workflow removes that dependency. GitHub Actions checks out the
# code and pushes a prebuilt deployment to Vercel directly, so a push
# to main always ships.
#
# SETUP (one time)
#   1. Create a Vercel token: vercel.com/account/settings/tokens
#      Scope it to the amitahlawatox's projects team. Name it
#      "github-actions". Copy the value.
#   2. In GitHub: repo -> Settings -> Secrets and variables -> Actions
#      -> New repository secret
#        Name:  VERCEL_TOKEN
#        Value: <the token>
#   3. Push anything to main, or run this workflow manually from the
#      Actions tab ("Run workflow").
#
# The org and project IDs below are identifiers, not credentials.
####################################################################

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you deploy manually from the Actions tab

env:
  VERCEL_ORG_ID: team_xIr05WKuFuH59g0nOFNm8jAo
  VERCEL_PROJECT_ID: prj_DIvmuSV7F4C0dWcXWNVPTnmKiz6Z

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Typecheck
        run: npx tsc --noEmit

      # Build with the project's own npm script rather than `vercel build`.
      # This is the same command Vercel runs, but failures surface as normal
      # npm errors instead of CLI-internal ones, and it lets the page-count
      # guard run against real output before anything is uploaded.
      - name: Build
        run: npm run build

      # Guard rail. The 11 July regression shipped a 45-page build to
      # production and removed every page that was ranking. If the page
      # count collapses again, stop here.
      - name: Verify page count before deploying
        run: |
          PAGES=$(find dist -name '*.html' | wc -l)
          SITEMAP=$(grep -c '<loc>' dist/sitemap.xml || echo 0)
          echo "Static HTML pages : $PAGES"
          echo "Sitemap URLs      : $SITEMAP"
          if [ "$PAGES" -lt 400 ]; then
            echo "::error::Only $PAGES pages built — expected 400+. Refusing to deploy."
            exit 1
          fi
          if [ "$SITEMAP" -lt 400 ]; then
            echo "::error::Sitemap has only $SITEMAP URLs — expected 400+. Refusing to deploy."
            exit 1
          fi
          echo "Guard passed."

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to production
        run: |
          URL=$(vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Deployed: $URL"
          {
            echo "### Deployed to production"
            echo ""
            echo "- URL: $URL"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- Live at: https://repaywise.co.uk"
          } >> "$GITHUB_STEP_SUMMARY"
